name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: 1/4 Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  backend:
    name: 2/4 Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m pytest

  admin-web:
    name: 3/4 React admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build
      - name: Verify committed admin assets are current
        working-directory: .
        run: git diff --exit-code -- python-backend/app/admin_static

  linux-native:
    name: 4/4 Linux native backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-backend/requirements.txt
      - name: Validate native deployment scripts
        shell: bash
        run: |
          bash -n deploy/linux/install.sh
          bash -n deploy/linux/update.sh
          bash -n deploy/linux/uninstall.sh
          bash -n deploy/linux/qingjuan-info.sh
          bash -n deploy/linux/qingjuan-password.sh
          bash -n deploy/linux/qingjuan-update-runner.sh
          bash deploy/linux/uninstall.sh --help >/dev/null
          bash deploy/linux/qingjuan-password.sh --help >/dev/null
          bash deploy/linux/update.sh --help >/dev/null
          grep -q '^ExecStart=/opt/qingjuan/current/venv/bin/python -m app.main serve' \
            deploy/linux/qingjuan-backend.service
          grep -q '^User=qingjuan$' deploy/linux/qingjuan-backend.service
          grep -q '^RuntimeDirectory=qingjuan$' deploy/linux/qingjuan-backend.service
          grep -Fq 'chown -R root:"$SERVICE_USER" "$VENV_DIR"' deploy/linux/install.sh
          grep -Fq 'chmod -R u=rwX,g=rX,o= "$VENV_DIR"' deploy/linux/install.sh
          grep -Fq 'chown -R root:"$SERVICE_USER" "$target_release"' deploy/linux/update.sh
          grep -Fq 'chmod -R u=rwX,g=rX,o= "$target_release"' deploy/linux/update.sh
          grep -Fq 'TRUSTED_UPSTREAM_REF="refs/qingjuan-updater/upstream"' deploy/linux/update.sh
          grep -Fq 'mktemp -d "$UPDATER_STATE_DIR/rollback.' deploy/linux/update.sh
          test "$(grep -n 'pip check' deploy/linux/update.sh | head -n1 | cut -d: -f1)" \
            -lt "$(grep -n 'systemctl stop "$SERVICE_NAME"' deploy/linux/update.sh | tail -n1 | cut -d: -f1)"
          grep -Fq 'QINGJUAN_ADMIN_PASSWORD_HASH=' deploy/linux/install.sh
          grep -Fq 'QINGJUAN_CONNECTION_TOKEN_FILE=' deploy/linux/install.sh
          grep -Fq 'QINGJUAN_UPDATE_REQUEST_FILE=' deploy/linux/install.sh
          grep -Fq 'chmod 0640 "$client_file"' deploy/linux/install.sh
          grep -Fq '管理界面：${admin_url}' deploy/linux/qingjuan-info.sh
          grep -Fq 'qingjuan-password.sh' deploy/linux/install.sh
          grep -q '^ExecStart=/usr/local/sbin/qingjuan-update-runner$' \
            deploy/linux/qingjuan-updater.service
          grep -q '^PathExists=/run/qingjuan/update-request.json$' \
            deploy/linux/qingjuan-updater.path
          test -f python-backend/app/admin_static/index.html
          sudo useradd --system --no-create-home qingjuan
          sudo install -d /opt/qingjuan/venv/bin /opt/qingjuan/app/python-backend
          sudo install -d /opt/qingjuan/releases/legacy
          sudo install -d -o qingjuan -g qingjuan /var/lib/qingjuan
          sudo install -d -m 0700 /etc/qingjuan
          sudo ln -s "$(command -v python)" /opt/qingjuan/venv/bin/python
          sudo chmod 0700 /opt/qingjuan/venv /opt/qingjuan/venv/bin
          sudo chown -R root:qingjuan /opt/qingjuan/venv
          sudo chmod -R u=rwX,g=rX,o= /opt/qingjuan/venv
          sudo ln -s /opt/qingjuan/app /opt/qingjuan/releases/legacy/app
          sudo ln -s /opt/qingjuan/venv /opt/qingjuan/releases/legacy/venv
          sudo ln -s /opt/qingjuan/releases/legacy /opt/qingjuan/current
          sudo install -o root -g root -m 0755 \
            deploy/linux/qingjuan-update-runner.sh /usr/local/sbin/qingjuan-update-runner
          sudo -u qingjuan test -x /opt/qingjuan/venv/bin/python
          printf '%s\n' \
            'QINGJUAN_BIND_HOST=127.0.0.1' \
            'QINGJUAN_PORT=19453' \
            | sudo tee /etc/qingjuan/backend.env >/dev/null
          systemd-analyze verify \
            deploy/linux/qingjuan-backend.service \
            deploy/linux/qingjuan-updater.service \
            deploy/linux/qingjuan-updater.path
      - name: Install backend dependencies
        working-directory: python-backend
        run: python -m pip install -r requirements.txt
      - name: Smoke test native process, console and authentication
        shell: bash
        working-directory: python-backend
        run: |
          token='qingjuan-ci-connection-token'
          admin_password='qingjuan-ci-admin-password'
          digest="$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
          admin_digest="$(printf '%s' "$admin_password" | python -c \
            'import sys; from app.admin_auth import hash_admin_password; print(hash_admin_password(sys.stdin.read()))')"
          data_dir="$(mktemp -d)"
          log_file="$data_dir/backend.log"
          client_file="$data_dir/client.env"
          printf 'QINGJUAN_CONNECTION_TOKEN=%s\n' "$token" > "$client_file"
          QINGJUAN_AUTH_TOKEN_SHA256="$digest" \
          QINGJUAN_CONNECTION_TOKEN_FILE="$client_file" \
          QINGJUAN_ADMIN_PASSWORD_HASH="$admin_digest" \
          QINGJUAN_ADMIN_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
          QINGJUAN_2FA_ENCRYPTION_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
          QINGJUAN_DATA_DIR="$data_dir" \
          QINGJUAN_PUBLIC_URL='http://127.0.0.1:19453' \
            python -m app.main serve --host 127.0.0.1 --port 19453 \
            >"$log_file" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" >/dev/null 2>&1 || true; wait "$backend_pid" 2>/dev/null || true; rm -rf "$data_dir"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19453/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:19453/healthz; then
            cat "$log_file" >&2
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:19453/admin/ | grep -q 'id="root"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:19453/api/v1/meta)" = '401'
          QINGJUAN_TEST_TOKEN="$token" python - <<'PY'
          import os
          import httpx

          response = httpx.get(
              "http://127.0.0.1:19453/api/v1/meta",
              headers={"Authorization": f"Bearer {os.environ['QINGJUAN_TEST_TOKEN']}"},
          )
          response.raise_for_status()
          assert response.json()["service"] == "qingjuan-backend"
          assert response.json()["capabilities"]["adminWeb"] is True
          PY
          login_response="$(curl --fail --silent \
            --cookie-jar "$data_dir/admin.cookies" \
            --header 'Content-Type: application/json' \
            --data "{\"password\":\"$admin_password\"}" \
            http://127.0.0.1:19453/admin/api/login)"
          csrf_token="$(printf '%s' "$login_response" | python -c \
            'import json, sys; print(json.load(sys.stdin)["csrfToken"])')"
          test -n "$csrf_token"
          curl --fail --silent --cookie "$data_dir/admin.cookies" \
            http://127.0.0.1:19453/api/v1/meta >/dev/null
          token_status="$(curl --fail --silent --cookie "$data_dir/admin.cookies" \
            http://127.0.0.1:19453/admin/api/connection-token)"
          if printf '%s' "$token_status" | grep -q "$token"; then
            echo 'raw token leaked into default status response' >&2
            exit 1
          fi
          revealed_token="$(curl --fail --silent --request POST \
            --cookie "$data_dir/admin.cookies" \
            --header "X-QingJuan-CSRF: $csrf_token" \
            http://127.0.0.1:19453/admin/api/connection-token/reveal \
            | python -c 'import json, sys; print(json.load(sys.stdin)["token"])')"
          test "$revealed_token" = "$token"
          curl --fail --silent --cookie "$data_dir/admin.cookies" \
            'http://127.0.0.1:19453/admin/api/runtime-logs?limit=50' \
            | python -c 'import json, sys; payload=json.load(sys.stdin); assert payload["total"] > 0'
          test -s "$data_dir/logs/server.jsonl"
          grep -q '客户端地址：http://127.0.0.1:19453' "$log_file"
          if grep -q "$token" "$log_file"; then
            echo 'raw token leaked into backend log' >&2
            exit 1
          fi
          if grep -q "$admin_password" "$log_file"; then
            echo 'raw admin password leaked into backend log' >&2
            exit 1
          fi
          if grep -q "$token" "$data_dir/logs/server.jsonl"; then
            echo 'raw token leaked into structured runtime log' >&2
            exit 1
          fi

  build-android:
    name: Build Android APK
    needs: [flutter-quality, backend, admin-web, linux-native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: QingJuan-${{ github.sha }}-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64
    needs: [flutter-quality, backend, admin-web, linux-native]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt
      - name: Install Windows backend build dependencies
        run: python -m pip install -r python-backend/requirements-dev.txt
      - name: Build Windows client and local backend
        shell: pwsh
        run: ./tool/build_windows.ps1
      - name: Smoke test packaged Windows backend
        shell: pwsh
        run: ./tool/smoke_test_windows_release.ps1
      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: ./tool/test_windows_installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: QingJuan-${{ github.sha }}-windows-x64
          path: release/qingjuan-windows
          if-no-files-found: error
          retention-days: 14
