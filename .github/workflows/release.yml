name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Validate tag and source versions
        shell: pwsh
        run: |
          ./tool/package_android.ps1 -Tag '${{ github.ref_name }}' -ValidateVersionOnly
          ./tool/package_windows.ps1 -Tag '${{ github.ref_name }}' -ValidateVersionOnly
      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install -r python-backend/requirements-dev.txt
          python -m pip check
          npm ci --prefix admin-web --ignore-scripts --no-audit
      - name: Run Flutter quality gates
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Run Python quality gates
        working-directory: python-backend
        run: |
          python -m ruff check app tests
          python -m pytest
      - name: Run React admin quality gates
        run: |
          npm test --prefix admin-web
          npm run build --prefix admin-web
          git diff --exit-code -- python-backend/app/admin_static

  android-release:
    name: Build signed Android release
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Android release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_STORE_PASSWORD)) {
            throw 'Android release signing secrets are incomplete.'
          }
          [IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE/android/app/qingjuan-release.jks",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          @(
            'storeFile=qingjuan-release.jks'
            "storePassword=$env:ANDROID_STORE_PASSWORD"
            "keyAlias=$env:ANDROID_KEY_ALIAS"
            "keyPassword=$env:ANDROID_KEY_PASSWORD"
          ) | Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE/android/key.properties"
      - run: flutter build apk --release
      - name: Package Android release
        id: package
        shell: pwsh
        run: ./tool/package_android.ps1 -Tag '${{ github.ref_name }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Build Windows x64 release
    needs: verify-release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt
      - name: Install Windows backend build dependencies
        run: python -m pip install -r python-backend/requirements-dev.txt
      - name: Build Windows client and local backend
        shell: pwsh
        run: ./tool/build_windows.ps1
      - name: Smoke test Windows client and packaged backend
        shell: pwsh
        run: ./tool/smoke_test_windows_release.ps1
      - name: Package Windows release
        id: package
        shell: pwsh
        run: ./tool/package_windows.ps1 -Tag '${{ github.ref_name }}'
      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: ./tool/test_windows_installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.installer_checksum }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Windows and Android release
    needs: [android-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notesFile = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$tag.md"
          $assets = @(
            Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE/release-assets" -File |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -ne 6) {
            throw "Expected six Windows/Android release assets, found $($assets.Count)."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ((Test-Path -LiteralPath $notesFile) -and $LASTEXITCODE -eq 0) {
              gh release edit $tag --notes-file $notesFile --title "青卷 $tag" --repo $env:GITHUB_REPOSITORY
            }
          }
          else {
            $arguments = @($tag) + $assets + @(
              '--verify-tag', '--latest', '--title', "青卷 $tag",
              '--repo', $env:GITHUB_REPOSITORY
            )
            if (Test-Path -LiteralPath $notesFile) {
              $arguments += @('--notes-file', $notesFile)
            }
            else {
              $arguments += '--generate-notes'
            }
            gh release create @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
